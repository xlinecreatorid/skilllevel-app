<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <style>
      .bg-paper { fill: #f5f0e6; }
      .bg-raised { fill: #fbf8f1; }
      .bg-sunk { fill: #ece5d7; }
      .border-rule { stroke: #d9cfbb; stroke-width: 1; }
      .border-strong { stroke: #b9ac93; stroke-width: 1; }
      .border-accent { stroke: #1f3f66; stroke-width: 1.5; }
      .text-ink { font-family: 'Iowan Old Style', Georgia, serif; fill: #1b1a17; }
      .text-sans { font-family: 'Segoe UI', system-ui, sans-serif; fill: #4a463d; }
      .text-faint { font-family: 'Segoe UI', system-ui, sans-serif; fill: #6b6355; }
      .btn-primary { fill: #1f3f66; rx: 2px; }
      .btn-primary-text { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #fbf8f1; text-anchor: middle; }
      .btn-quiet { fill: transparent; stroke: #b9ac93; stroke-width: 1; rx: 2px; }
      .btn-quiet-text { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #1b1a17; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1440" height="960" class="bg-paper" />

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="70" class="bg-raised" />
  <line x1="0" y1="70" x2="1440" y2="70" class="border-rule" />
  <text x="140" y="44" class="text-ink" font-size="24" font-weight="bold">Skilllevel</text>
  <text x="250" y="43" class="text-faint" font-size="11" font-weight="600" letter-spacing="1.5">JALUR WEB FULLSTACK</text>

  <!-- Navigation Bar -->
  <rect x="0" y="70" width="1440" height="46" class="bg-raised" />
  <line x1="0" y1="116" x2="1440" y2="116" class="border-rule" />
  <text x="140" y="99" class="text-sans" font-size="14">Dashboard</text>
  <text x="240" y="99" class="text-sans" font-size="14">Modul</text>
  <text x="320" y="99" class="text-sans" font-size="14" font-weight="bold" fill="#1b1a17">Kuis</text>
  <line x1="320" y1="115" x2="355" y2="115" stroke="#1f3f66" stroke-width="2" />
  <text x="390" y="99" class="text-sans" font-size="14">Tutor</text>
  <text x="465" y="99" class="text-sans" font-size="14">Unggah</text>
  <text x="555" y="99" class="text-sans" font-size="14">Progres</text>

  <!-- Main Content -->
  <g transform="translate(140, 150)">
    <text x="0" y="15" class="text-faint" font-size="11" font-weight="bold" letter-spacing="1.5">EVALUASI PEMAHAMAN</text>
    <text x="0" y="50" class="text-ink" font-size="28" font-weight="bold">Uji Pemahaman per Modul</text>
    <text x="0" y="80" class="text-sans" font-size="14" fill="#6b6355">Soal diambil dari materi kurikulum untuk menguji pemahaman konsep secara mendalam.</text>

    <!-- Quiz Question Card 1 -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="1160" height="320" fill="#fbf8f1" stroke="#d9cfbb" rx="2" />
      <text x="30" y="38" font-family="'Cascadia Code', monospace" font-size="13" fill="#6b6355">SOAL 1 DARI 10</text>
      <text x="30" y="70" class="text-ink" font-size="18" font-weight="bold">Apa perbedaan mendasar antara DOM Tree dan Render Tree di browser?</text>

      <!-- Option 1 -->
      <g transform="translate(30, 95)">
        <rect x="0" y="0" width="1100" height="42" fill="#f5f0e6" stroke="#b9ac93" rx="2" />
        <circle cx="25" cy="21" r="7" fill="none" stroke="#6b6355" stroke-width="1.5" />
        <text x="45" y="26" class="text-sans" font-size="14">A. DOM tree memuat seluruh elemen HTML, sedangkan Render tree hanya memuat elemen yang terlihat di layar.</text>
      </g>

      <!-- Option 2 (Selected) -->
      <g transform="translate(30, 145)">
        <rect x="0" y="0" width="1100" height="42" fill="#e3e9f1" stroke="#1f3f66" stroke-width="1.5" rx="2" />
        <circle cx="25" cy="21" r="7" fill="#1f3f66" />
        <circle cx="25" cy="21" r="3" fill="#fbf8f1" />
        <text x="45" y="26" class="text-sans" font-size="14" font-weight="600" fill="#1f3f66">B. Render tree memuat seluruh node termasuk script dan meta tags, sedangkan DOM tree hanya CSS.</text>
      </g>

      <!-- Option 3 -->
      <g transform="translate(30, 195)">
        <rect x="0" y="0" width="1100" height="42" fill="#f5f0e6" stroke="#b9ac93" rx="2" />
        <circle cx="25" cy="21" r="7" fill="none" stroke="#6b6355" stroke-width="1.5" />
        <text x="45" y="26" class="text-sans" font-size="14">C. DOM tree dibangun oleh JavaScript engine, sedangkan Render tree oleh CSS parser.</text>
      </g>

      <!-- Option 4 -->
      <g transform="translate(30, 245)">
        <rect x="0" y="0" width="1100" height="42" fill="#f5f0e6" stroke="#b9ac93" rx="2" />
        <circle cx="25" cy="21" r="7" fill="none" stroke="#6b6355" stroke-width="1.5" />
        <text x="45" y="26" class="text-sans" font-size="14">D. Keduanya sama persis dan tidak memiliki perbedaan fungsi di browser.</text>
      </g>
    </g>

    <!-- Navigation Buttons -->
    <g transform="translate(0, 460)">
      <rect x="0" y="0" width="180" height="44" class="btn-primary" />
      <text x="90" y="27" class="btn-primary-text" font-size="14">Kumpulkan Jawaban</text>

      <rect x="195" y="0" width="120" height="44" class="btn-quiet" />
      <text x="255" y="27" class="btn-quiet-text" font-size="14">Batalkan Kuis</text>
    </g>
  </g>
</svg>
