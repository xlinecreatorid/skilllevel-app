<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <style>
      .bg-paper { fill: #f5f0e6; }
      .bg-raised { fill: #fbf8f1; }
      .bg-sunk { fill: #ece5d7; }
      .border-rule { stroke: #d9cfbb; stroke-width: 1; }
      .border-strong { stroke: #b9ac93; stroke-width: 1; }
      .text-ink { font-family: 'Iowan Old Style', Georgia, serif; fill: #1b1a17; }
      .text-sans { font-family: 'Segoe UI', system-ui, sans-serif; fill: #4a463d; }
      .text-faint { font-family: 'Segoe UI', system-ui, sans-serif; fill: #6b6355; }
      .btn-primary { fill: #1f3f66; rx: 2px; }
      .btn-primary-text { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #fbf8f1; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1440" height="960" class="bg-paper" />

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="70" class="bg-raised" />
  <line x1="0" y1="70" x2="1440" y2="70" class="border-rule" />
  <text x="140" y="44" class="text-ink" font-size="24" font-weight="bold">Skilllevel</text>
  <text x="250" y="43" class="text-faint" font-size="11" font-weight="600" letter-spacing="1.5">JALUR WEB FULLSTACK</text>

  <!-- Navigation Bar -->
  <rect x="0" y="70" width="1440" height="46" class="bg-raised" />
  <line x1="0" y1="116" x2="1440" y2="116" class="border-rule" />
  <text x="140" y="99" class="text-sans" font-size="14">Dashboard</text>
  <text x="240" y="99" class="text-sans" font-size="14">Modul</text>
  <text x="320" y="99" class="text-sans" font-size="14">Kuis</text>
  <text x="390" y="99" class="text-sans" font-size="14" font-weight="bold" fill="#1f3f66">Tutor</text>
  <line x1="390" y1="115" x2="430" y2="115" stroke="#1f3f66" stroke-width="2" />
  <text x="465" y="99" class="text-sans" font-size="14">Unggah</text>
  <text x="555" y="99" class="text-sans" font-size="14">Progres</text>

  <!-- Main Content Layout -->
  <g transform="translate(140, 150)">
    <text x="0" y="15" class="text-faint" font-size="11" font-weight="bold" letter-spacing="1.5">ASISTEN BELAJAR CERDAS</text>
    <text x="0" y="50" class="text-ink" font-size="28" font-weight="bold">Tanya Jawab Terfokus Modul</text>

    <!-- Chat Box (Left 820px) -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="820" height="600" fill="#fbf8f1" stroke="#d9cfbb" rx="2" />
      <line x1="0" y1="50" x2="820" y2="50" class="border-rule" />
      <text x="25" y="32" class="text-faint" font-size="11" font-weight="bold" letter-spacing="1.5">PERCAKAPAN</text>
      <rect x="120" y="17" width="220" height="22" fill="#e3e9f1" stroke="#1f3f66" stroke-width="1" rx="2" />
      <text x="230" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#1f3f66" text-anchor="middle">Modul 01: Browser Internals</text>

      <!-- Message 1 (User) -->
      <g transform="translate(25, 75)">
        <text x="0" y="0" class="text-faint" font-size="11" font-weight="bold">KAMU</text>
        <line x1="0" y1="8" x2="0" y2="40" stroke="#b9ac93" stroke-width="2" />
        <text x="12" y="24" class="text-sans" font-size="14">Apa fungsi utama render tree dan bagaimana bedanya dengan DOM tree?</text>
      </g>

      <!-- Message 2 (Tutor) -->
      <g transform="translate(25, 140)">
        <text x="0" y="0" class="text-faint" font-size="11" font-weight="bold" fill="#1f3f66">TUTOR AI</text>
        <line x1="0" y1="8" x2="0" y2="120" stroke="#1f3f66" stroke-width="2" />
        <text x="12" y="24" class="text-sans" font-size="14">Render Tree adalah struktur internal yang hanya memuat elemen-elemen visual yang benar-benar</text>
        <text x="12" y="46" class="text-sans" font-size="14">akan ditampilkan ke layar peramban.</text>
        <text x="12" y="78" class="text-sans" font-size="14">• DOM Tree memuat semua node HTML (termasuk &lt;head&gt;, &lt;script&gt;, dan elemen display: none).</text>
        <text x="12" y="102" class="text-sans" font-size="14">• Render Tree hanya menggabungkan DOM yang tampak dengan CSSOM untuk menghitung layout.</text>
      </g>

      <!-- Input Bar -->
      <line x1="0" y1="490" x2="820" y2="490" class="border-rule" />
      <rect x="25" y="510" width="770" height="42" fill="#f5f0e6" stroke="#b9ac93" rx="2" />
      <text x="40" y="536" class="text-faint" font-size="14">Tulis pertanyaan seputar modul ini... (Tekan Ctrl+Enter)</text>
      <rect x="690" y="515" width="95" height="32" class="btn-primary" />
      <text x="737" y="536" class="btn-primary-text" font-size="13">Kirim</text>
    </g>

    <!-- Sidebar Focus & Suggestions (Right 320px) -->
    <g transform="translate(845, 80)">
      <rect x="0" y="0" width="315" height="130" fill="#fbf8f1" stroke="#d9cfbb" rx="2" />
      <text x="20" y="30" class="text-sans" font-size="12" font-weight="bold">Fokus Materi</text>
      <rect x="20" y="45" width="275" height="38" fill="#f5f0e6" stroke="#b9ac93" rx="2" />
      <text x="32" y="68" class="text-sans" font-size="13">01 · Cara Browser Menampilkan</text>
      <rect x="20" y="92" width="110" height="26" fill="transparent" stroke="#b9ac93" rx="2" />
      <text x="75" y="109" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#1b1a17" text-anchor="middle">Buka Modul</text>

      <rect x="0" y="145" width="315" height="230" fill="#fbf8f1" stroke="#d9cfbb" rx="2" />
      <text x="20" y="175" class="text-faint" font-size="11" font-weight="bold" letter-spacing="1.5">SARAN PERTANYAAN</text>

      <rect x="20" y="195" width="275" height="48" fill="#f5f0e6" stroke="#d9cfbb" rx="2" />
      <text x="30" y="217" class="text-sans" font-size="12">Apa itu tahapan Layout dan</text>
      <text x="30" y="233" class="text-sans" font-size="12">Repaint di browser?</text>

      <rect x="20" y="252" width="275" height="48" fill="#f5f0e6" stroke="#d9cfbb" rx="2" />
      <text x="30" y="274" class="text-sans" font-size="12">Bagaimana DNS lookup bekerja</text>
      <text x="30" y="290" class="text-sans" font-size="12">saat pengguna membuka URL?</text>

      <rect x="20" y="309" width="275" height="48" fill="#f5f0e6" stroke="#d9cfbb" rx="2" />
      <text x="30" y="331" class="text-sans" font-size="12">Jelaskan Critical Rendering Path</text>
      <text x="30" y="347" class="text-sans" font-size="12">secara sederhana.</text>
    </g>
  </g>
</svg>
