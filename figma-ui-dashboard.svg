<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <style>
      .bg-paper { fill: #f5f0e6; }
      .bg-raised { fill: #fbf8f1; }
      .bg-sunk { fill: #ece5d7; }
      .border-rule { stroke: #d9cfbb; stroke-width: 1; }
      .border-strong { stroke: #b9ac93; stroke-width: 1; }
      .border-accent { stroke: #1f3f66; stroke-width: 1.5; }
      .text-ink { font-family: 'Iowan Old Style', Georgia, serif; fill: #1b1a17; }
      .text-sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #4a463d; }
      .text-faint { font-family: 'Segoe UI', system-ui, sans-serif; fill: #6b6355; }
      .text-accent { fill: #1f3f66; }
      .btn-primary { fill: #1f3f66; rx: 2px; }
      .btn-primary-text { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #fbf8f1; text-anchor: middle; }
      .btn-quiet { fill: transparent; stroke: #b9ac93; stroke-width: 1; rx: 2px; }
      .btn-quiet-text { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #1b1a17; text-anchor: middle; }
      .tag-accent { fill: #e3e9f1; stroke: #1f3f66; stroke-width: 1; rx: 2px; }
      .tag-ok { fill: #e2ebdf; stroke: #2f5d3a; stroke-width: 1; rx: 2px; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="960" class="bg-paper" />

  <!-- ================= HEADER ================= -->
  <rect x="0" y="0" width="1440" height="70" class="bg-raised" />
  <line x1="0" y1="70" x2="1440" y2="70" class="border-rule" />

  <text x="140" y="44" class="text-ink" font-size="24" font-weight="bold">Skilllevel</text>
  <text x="250" y="43" class="text-faint" font-size="11" font-weight="600" letter-spacing="1.5">JALUR WEB FULLSTACK</text>

  <!-- Level Meter in Header -->
  <text x="920" y="36" class="text-faint" font-size="11" font-weight="600">PEMULA</text>
  <text x="990" y="36" class="text-faint" font-size="11">50 XP</text>
  <rect x="920" y="43" width="105" height="5" class="bg-sunk" rx="2" />
  <rect x="920" y="43" width="35" height="5" fill="#1f3f66" rx="2" />

  <!-- Language Switcher -->
  <rect x="1050" y="22" width="60" height="28" fill="#fbf8f1" stroke="#b9ac93" rx="2" />
  <rect x="1050" y="22" width="30" height="28" fill="#1f3f66" rx="2" />
  <text x="1065" y="41" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#fbf8f1" text-anchor: middle; text-anchor="middle">ID</text>
  <text x="1095" y="41" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#4a463d" text-anchor: middle; text-anchor="middle">EN</text>

  <!-- AI Settings Button -->
  <rect x="1125" y="22" width="120" height="28" class="btn-quiet" />
  <text x="1180" y="41" class="btn-quiet-text" font-size="13">Pengaturan AI</text>
  <circle cx="1232" cy="36" r="3" fill="#2f5d3a" />

  <!-- Sign In Button -->
  <rect x="1260" y="22" width="80" height="28" class="btn-primary" />
  <text x="1300" y="41" class="btn-primary-text" font-size="13">Masuk</text>

  <!-- Navigation Bar -->
  <rect x="0" y="70" width="1440" height="46" class="bg-raised" />
  <line x1="0" y1="116" x2="1440" y2="116" class="border-rule" />

  <!-- Nav Items -->
  <text x="140" y="99" class="text-sans" font-size="14" font-weight="bold" fill="#1b1a17">Dashboard</text>
  <line x1="140" y1="115" x2="210" y2="115" stroke="#1f3f66" stroke-width="2" />

  <text x="240" y="99" class="text-sans" font-size="14">Modul</text>
  <text x="320" y="99" class="text-sans" font-size="14">Kuis</text>
  <text x="390" y="99" class="text-sans" font-size="14">Tutor</text>
  <text x="465" y="99" class="text-sans" font-size="14">Unggah</text>
  <text x="555" y="99" class="text-sans" font-size="14">Progres</text>

  <!-- ================= HERO & STATS SECTION ================= -->
  <!-- Left Hero Column -->
  <text x="140" y="165" class="text-faint" font-size="11" font-weight="bold" letter-spacing="1.5">JALUR WEB FULLSTACK TERSTRUKTUR</text>
  <text x="140" y="210" class="text-ink" font-size="34" font-weight="bold">Sembilan modul, satu jalur belajar</text>
  <text x="140" y="250" class="text-ink" font-size="34" font-weight="bold">yang bisa kamu tempuh sendiri.</text>
  
  <text x="140" y="290" class="text-sans" font-size="15" fill="#4a463d">Setiap modul berisi langkah bertahap, contoh nyata, dan kuis evaluasi.</text>
  <text x="140" y="312" class="text-sans" font-size="15" fill="#4a463d">Tutor AI menjawab berlandaskan materi terpilih tanpa kebocoran konteks.</text>

  <!-- CTA Buttons -->
  <rect x="140" y="340" width="280" height="46" class="btn-primary" />
  <text x="280" y="368" class="btn-primary-text" font-size="15">Lanjut ke Modul 01: Browser</text>

  <rect x="435" y="340" width="140" height="46" class="btn-quiet" />
  <text x="505" y="368" class="btn-quiet-text" font-size="15">Tanya Tutor</text>

  <!-- Right Stats Card -->
  <rect x="850" y="150" width="450" height="235" class="bg-raised" stroke="#d9cfbb" rx="2" />
  <text x="880" y="185" class="text-faint" font-size="11" font-weight="bold" letter-spacing="1.5">POSISI BELAJAR KAMU</text>

  <g transform="translate(880, 215)">
    <text x="0" y="0" class="text-faint" font-size="11" font-weight="bold">LEVEL</text>
    <text x="0" y="26" class="text-ink" font-size="28" font-weight="bold">Pemula</text>
    <text x="0" y="44" class="text-faint" font-size="12">150 XP lagi ke Menengah</text>
  </g>

  <g transform="translate(1080, 215)">
    <text x="0" y="0" class="text-faint" font-size="11" font-weight="bold">TOTAL XP</text>
    <text x="0" y="26" class="text-ink" font-size="28" font-weight="bold">50 XP</text>
    <text x="0" y="44" class="text-faint" font-size="12">1 hari berturut-turut</text>
  </g>

  <g transform="translate(880, 290)">
    <text x="0" y="0" class="text-faint" font-size="11" font-weight="bold">MODUL SELESAI</text>
    <text x="0" y="26" class="text-ink" font-size="28" font-weight="bold">1 / 9</text>
    <text x="0" y="44" class="text-faint" font-size="12">11% jalur kurikulum</text>
  </g>

  <g transform="translate(1080, 290)">
    <text x="0" y="0" class="text-faint" font-size="11" font-weight="bold">RATA-RATA KUIS</text>
    <text x="0" y="26" class="text-ink" font-size="28" font-weight="bold">100%</text>
    <text x="0" y="44" class="text-faint" font-size="12">1 kuis dikerjakan</text>
  </g>

  <rect x="880" y="360" width="390" height="6" class="bg-sunk" rx="2" />
  <rect x="880" y="360" width="50" height="6" fill="#1f3f66" rx="2" />

  <!-- ================= MODULE ROADMAP LIST ================= -->
  <line x1="140" y1="420" x2="1300" y2="420" class="border-rule" />
  <text x="140" y="450" class="text-faint" font-size="11" font-weight="bold" letter-spacing="1.5">PETA JALUR KURIKULUM</text>
  <text x="140" y="480" class="text-ink" font-size="24" font-weight="bold">Sembilan Modul Berurutan</text>
  
  <rect x="1100" y="455" width="200" height="34" class="btn-quiet" />
  <text x="1200" y="477" class="btn-quiet-text" font-size="13">+ Tambah Modul Dokumen</text>

  <!-- Module 1 Row -->
  <g transform="translate(140, 510)">
    <rect x="0" y="0" width="1160" height="85" fill="#fbf8f1" stroke="#d9cfbb" rx="2" />
    <text x="25" y="38" font-family="'Cascadia Code', monospace" font-size="16" fill="#6b6355">01</text>
    <text x="75" y="38" class="text-ink" font-size="18" font-weight="bold">Cara Browser Menampilkan Halaman Web</text>
    <rect x="450" y="23" width="60" height="20" class="tag-ok" />
    <text x="480" y="37" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#2f5d3a" text-anchor="middle">SELESAI</text>
    <rect x="520" y="23" width="75" height="20" class="tag-accent" />
    <text x="557" y="37" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#1f3f66" text-anchor="middle">KUIS 100%</text>
    
    <text x="75" y="62" class="text-sans" font-size="13">Dari URL yang diketik sampai piksel pertama di layar: DNS, TCP, HTTP, DOM tree, render tree, dan layout.</text>
    <text x="960" y="48" class="text-faint" font-size="12">DASAR WEB · 12 MENIT</text>
  </g>

  <!-- Module 2 Row -->
  <g transform="translate(140, 610)">
    <rect x="0" y="0" width="1160" height="85" fill="#fbf8f1" stroke="#d9cfbb" rx="2" />
    <text x="25" y="38" font-family="'Cascadia Code', monospace" font-size="16" fill="#6b6355">02</text>
    <text x="75" y="38" class="text-ink" font-size="18" font-weight="bold">HTML Bermakna dan Aksesibel</text>
    
    <text x="75" y="62" class="text-sans" font-size="13">Menyusun dokumen yang dipahami mesin pencari, pembaca layar, dan pengembang lain tanpa div berlebihan.</text>
    <text x="1000" y="48" class="text-faint" font-size="12">HTML · 14 MENIT</text>
  </g>

  <!-- Module 3 Row -->
  <g transform="translate(140, 710)">
    <rect x="0" y="0" width="1160" height="85" fill="#fbf8f1" stroke="#d9cfbb" rx="2" />
    <text x="25" y="38" font-family="'Cascadia Code', monospace" font-size="16" fill="#6b6355">03</text>
    <text x="75" y="38" class="text-ink" font-size="18" font-weight="bold">CSS: Tata Letak dan Sistem Desain</text>
    
    <text x="75" y="62" class="text-sans" font-size="13">Flexbox untuk satu dimensi, Grid untuk dua dimensi, token warna konsisten, dan tipografi yang nyaman dibaca.</text>
    <text x="1010" y="48" class="text-faint" font-size="12">CSS · 18 MENIT</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="890" width="1440" height="70" class="bg-raised" />
  <line x1="0" y1="890" x2="1440" y2="890" class="border-rule" />
  <text x="140" y="930" class="text-faint" font-size="13">Progres belajar tersimpan aman secara end-to-end.</text>
  <text x="1220" y="930" font-family="'Cascadia Code', monospace" font-size="12" fill="#6b6355">Skilllevel v2.1</text>
</svg>
